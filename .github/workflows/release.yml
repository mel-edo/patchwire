name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y libpipewire-0.3-dev libgtk-4-dev libadwaita-1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release

      - name: Package release tarball
        run: |
          VERSION=${GITHUB_REF_NAME}
          mkdir -p dist
          cp target/release/patchwire dist/
          cp target/release/patchwire-gtk dist/
          cp data/patchwire.service dist/
          cp data/patchwire.desktop dist/
          cp LICENSE dist/
          tar -czf patchwire-${VERSION}-x86_64-linux.tar.gz -C dist .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: patchwire-*-x86_64-linux.tar.gz
          generate_release_notes: true

      - name: Get version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Get binary tarball sha256
        run: |
          echo "BIN_SHA256=$(sha256sum patchwire-${GITHUB_REF_NAME}-x86_64-linux.tar.gz | cut -d' ' -f1)" >> $GITHUB_ENV

      - name: Get source tarball sha256
        run: |
          URL="https://github.com/${{ github.repository }}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          wget -q "$URL" -O source.tar.gz
          echo "SRC_SHA256=$(sha256sum source.tar.gz | cut -d' ' -f1)" >> $GITHUB_ENV

      - name: Publish patchwire-bin to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v3
        with:
          pkgname: patchwire-bin
          pkgbuild: ./packaging/patchwire-bin/PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to v${{ env.VERSION }}"
        env:
          VERSION: ${{ env.VERSION }}
          BIN_SHA256: ${{ env.BIN_SHA256 }}

      - name: Publish patchwire to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v3
        with:
          pkgname: patchwire
          pkgbuild: ./packaging/patchwire/PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to v${{ env.VERSION }}"
        env:
          VERSION: ${{ env.VERSION }}
          SRC_SHA256: ${{ env.SRC_SHA256 }}